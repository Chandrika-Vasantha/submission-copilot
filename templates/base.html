<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Submission intake{% endblock %} · Knight Trucking</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 28'%3E%3Cpath d='M13 1 3 4v10c0 6 4.5 10.5 10 13 5.5-2.5 10-7 10-13V4z' fill='%2314213d'/%3E%3Cpath d='M8 9v10M8 14l6-5M10 12.5 15 19' stroke='%23fff' stroke-width='2.2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="bar"><div class="in">
  <a class="brand" href="{{ url_for('inbox') }}">
    <svg class="shield" viewBox="0 0 26 28" aria-hidden="true"><path d="M13 1 3 4v10c0 6 4.5 10.5 10 13 5.5-2.5 10-7 10-13V4z" fill="#fff"/><path d="M8.5 9v10M8.5 14.2l6-5.2M10.6 12.6l5 6.4" stroke="#14213d" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
    Knight Trucking <span>submission intake</span></a>
  {% set ep = request.endpoint %}
  <a href="{{ url_for('inbox') }}" class="{{ 'on' if ep in ('inbox','submission','source_view') }}">Inbox</a>
  <a href="{{ url_for('rules_view') }}" class="{{ 'on' if ep == 'rules_view' }}">Rules</a>
  <a href="{{ url_for('architecture') }}" class="{{ 'on' if ep == 'architecture' }}">How it works</a>
</div></header>
<main class="wrap">{% block body %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
